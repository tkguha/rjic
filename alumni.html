<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>List of Alumni | RJIC 2026</title>

<link rel="stylesheet" href="assets/css/style.css">

<!-- Excel reader -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<!-- Load header & footer -->
<script src="assets/js/main.js" defer></script>
</head>

<body>

<div id="header"></div>

<main class="page container">

<h2 class="fade-in">List of Alumni (data as collected till 20th January 2026)</h2>

<div style="margin-bottom:15px;">
  <label for="yearFilter"><strong>Select Year of Entry:</strong></label>
  <select id="yearFilter">
    <option value="all">All Years</option>
  </select>
</div>

<div style="overflow-x:auto;">

<table id="alumniTable" class="styled-table">
  <thead>
    <tr>
      <th>Sl. No.</th>
      <th>Name</th>
      <th>Courses Completed</th>
      <th>Year of Entry</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

</div>

</main>

<div id="footer"></div>

<script>

fetch("assets/data/alumni.xlsx")
.then(res => res.arrayBuffer())
.then(data => {

  const workbook = XLSX.read(data, {type:"array"});
  const sheet = workbook.Sheets[workbook.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, {header:1});

  const dataRows = rows.slice(1); // skip header row

  const tbody = document.querySelector("#alumniTable tbody");
  const yearFilter = document.getElementById("yearFilter");

  // Collect unique years (Column D = index 3)
  const years = [...new Set(dataRows.map(r => r[3]).filter(y => y))].sort();

  years.forEach(year => {
    yearFilter.innerHTML += `<option value="${year}">${year}</option>`;
  });

  function renderTable(list){

    tbody.innerHTML = "";

    list.forEach((r, index) => {

      const row = `
        <tr>
          <td>${index + 1}</td>
          <td>${r[1] || ""}</td>
          <td>${r[2] || ""}</td>
          <td>${r[3] || ""}</td>
        </tr>
      `;

      tbody.innerHTML += row;
    });
  }

  // Show all initially
  renderTable(dataRows);

  // Filter by year
  yearFilter.addEventListener("change", () => {

    const selectedYear = yearFilter.value;

    if(selectedYear === "all"){
      renderTable(dataRows);
    } else {
      const filtered = dataRows.filter(r => r[3] == selectedYear);
      renderTable(filtered);
    }

  });

});

</script>

</body>
</html>
